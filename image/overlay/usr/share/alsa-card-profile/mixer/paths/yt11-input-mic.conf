; YT-J706F internal microphones port: AS33970 voice processor -> I2S2 -> UL2
; (PCM device 5) on the "mt6785mt6359" card. The voice processor has no gain
; control of its own here: the capture volume stays in software (PipeWire).
[General]
priority = 100
description-key = analog-input-microphone-internal

[Properties]
device.icon_name = audio-input-microphone

; I2S2 -> UL2 routing (left to CH1, right to CH2).
[Element UL2_CH1 I2S2_CH1]
switch = on
volume = off

[Element UL2_CH2 I2S2_CH2]
switch = on
volume = off
