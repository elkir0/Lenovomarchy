; YT-J706F internal speaker port: DL1 -> I2S1 -> four speaker amplifiers
; (SPK1/SPK2 left, SPK3/SPK4 right) on the "mt6785mt6359" card.
; The amps run without their DSP speaker protection, so their hardware gain
; is fixed at a conservative level here (constant volumes below) and the user
; volume stays in software (PipeWire): no element is merged for volume on
; this port. "HP Mux" is parked on Open so the MT6359 headphone output is
; disconnected while the speaker plays.
[General]
priority = 100
description-key = analog-output-speaker

[Properties]
device.icon_name = audio-speakers

; Speaker DAPM pin.
[Element Speaker]
switch = on
volume = ignore

; DL1 -> speaker I2S1 routing (left to CH1, right to CH2).
[Element I2S1_CH1 DL1_CH1]
switch = on
volume = off

[Element I2S1_CH2 DL1_CH2]
switch = on
volume = off

; Amplifier digital gain, raw 0..913, 0.125 dB/step: 816 = 0 dB, 0 = mute.
; Kept constant at 0 dB; attenuation happens in software.
[Element SPK1 Digital PCM]
volume = 816

[Element SPK2 Digital PCM]
volume = 816

[Element SPK3 Digital PCM]
volume = 816

[Element SPK4 Digital PCM]
volume = 816

; Amplifier analog gain, raw 0..20, 0.5 dB + 1 dB/step: 10 = 10.5 dB.
; Fixed moderate value: without the DSP speaker protection a higher gain
; makes the speakers rasp.
[Element SPK1 Analog PCM]
volume = 10

[Element SPK2 Analog PCM]
volume = 10

[Element SPK3 Analog PCM]
volume = 10

[Element SPK4 Analog PCM]
volume = 10

; MT6359 headphone output mux: parked on Open (disconnected) on this port.
; Enumeration = select: the [Option HP Mux:Open] section picks the enum item.
[Element HP Mux]
enumeration = select

[Option HP Mux:Open]
name = output-speaker

; Headphone DAC routing must stay off while the speaker plays.
[Element ADDA_DL_CH1 DL1_CH1]
switch = off
volume = off

[Element ADDA_DL_CH2 DL1_CH2]
switch = off
volume = off

; The speaker port is unavailable while headphones are plugged (plugged = no)
; and falls back to "unknown" (available) once they are unplugged, so
; PipeWire switches back to the speaker automatically.
[Jack Headphone]
state.plugged = no
state.unplugged = unknown
