; YT-J706F internal speaker port: DL1 -> I2S1 -> four speaker amplifiers
; (SPK1/SPK2 left, SPK3/SPK4 right) on the "mt6785mt6359" card.
; The amps' digital gain is fixed at 0 dB here and their analog gain is set
; by yt11-audio-defaults (17.5 dB behind the DSP speaker protection, 10.5 dB
; without it); the user volume stays in software (PipeWire): no element is
; merged for volume on this port. "HP Mux" is parked on Open: the MT6359
; headphone output is not wired on this board.
[General]
priority = 100
description-key = analog-output-speaker

[Properties]
device.icon_name = audio-speakers

; Speaker DAPM pin.
[Element Speaker]
switch = on
volume = ignore

; DL1 -> speaker I2S1 routing (left to CH1, right to CH2).
[Element I2S1_CH1 DL1_CH1]
switch = on
volume = off

[Element I2S1_CH2 DL1_CH2]
switch = on
volume = off

; Amplifier digital gain, raw 0..913, 0.125 dB/step: 816 = 0 dB, 0 = mute.
; Kept constant at 0 dB; attenuation happens in software.
[Element SPK1 Digital PCM]
volume = 816

[Element SPK2 Digital PCM]
volume = 816

[Element SPK3 Digital PCM]
volume = 816

[Element SPK4 Digital PCM]
volume = 816

; MT6359 headphone output mux: parked on Open (disconnected) on this port.
; Enumeration = select: the [Option HP Mux:Open] section picks the enum item.
[Element HP Mux]
enumeration = select

[Option HP Mux:Open]
name = output-speaker

; DL1 -> MT6359 DAC routing (the boot-time default, see yt11-audio-defaults)
; goes off while the speaker plays.
[Element ADDA_DL_CH1 DL1_CH1]
switch = off
volume = off

[Element ADDA_DL_CH2 DL1_CH2]
switch = off
volume = off
