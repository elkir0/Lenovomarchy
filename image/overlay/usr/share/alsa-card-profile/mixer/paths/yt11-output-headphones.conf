; YT-J706F headphones port: DL1 -> MT6359 DAC (ADDA_DL_CHx) -> HP Mux ->
; headphone amplifier, on the "mt6785mt6359" card. Volume is the MT6359
; "Headset" control (raw 0..20, -12 dB + 1 dB/step) merged as the user
; volume; the speaker route is killed so sound does not play there too.
[General]
priority = 9900
description-key = analog-output-headphones

[Properties]
device.icon_name = audio-headphones

; MT6359 headphone amplifier volume: merged (user volume in PipeWire).
; override-map.2 splits the stereo control to per-channel balance.
[Element Headset]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

; Kill the speaker route when the headphones are in use.
[Element Speaker]
switch = off
volume = ignore

[Element I2S1_CH1 DL1_CH1]
switch = off
volume = off

[Element I2S1_CH2 DL1_CH2]
switch = off
volume = off

; DL1 -> MT6359 DAC routing for the headphones.
[Element ADDA_DL_CH1 DL1_CH1]
switch = on
volume = off

[Element ADDA_DL_CH2 DL1_CH2]
switch = on
volume = off

; MT6359 output mux: connect the DAC to the headphone output. The constant
; SPK volumes live in the speaker path only, so nothing is needed here.
[Element HP Mux]
enumeration = select

[Option HP Mux:Audio Playback]
name = output-headphones

; 3.5 mm jack detection: the port is available while "Headphone Jack" is on.
; Unplugged (no) hides the port and moves playback back to the speaker.
[Jack Headphone]
state.plugged = yes
state.unplugged = no
