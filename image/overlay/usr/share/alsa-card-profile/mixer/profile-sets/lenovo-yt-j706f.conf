; ACP (PipeWire/PulseAudio) profile set for the Lenovo YT-J706F (Yoga Tab 11)
; sound card "mt6785mt6359" (MT6785 SoC + MT6359 codec): stereo playback on
; DL1, PCM device 0 (hw:%f,0), one port: the internal speakers (the tablet
; has no 3.5 mm jack); stereo capture on UL2, PCM device 5 (hw:%f,5), one
; port: the internal microphones behind the AS33970 voice processor.
; Selected by the udev property ACP_PROFILE_SET (90-yt11-audio.rules); path
; names are resolved in /usr/share/alsa-card-profile/mixer/paths/.
; The speaker-only profile stays as the fallback when the capture device
; cannot be opened (voice processor firmware not installed).

[General]
auto-profiles = no

[Mapping analog-stereo]
description = Speaker
device-strings = hw:%f,0
channel-map = left,right
paths-output = yt11-output-speaker
direction = output

[Profile output:analog-stereo]
description = Speaker
output-mappings = analog-stereo
priority = 100

[Mapping analog-input]
description = Microphones
device-strings = hw:%f,5
channel-map = left,right
paths-input = yt11-input-mic
direction = input

[Profile output:analog-stereo+input:analog-input]
description = Speaker + Microphones
output-mappings = analog-stereo
input-mappings = analog-input
priority = 110
