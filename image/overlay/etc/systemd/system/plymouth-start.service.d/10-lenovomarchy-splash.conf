# Pass an explicit command line to plymouthd so it displays the graphical splash
# and never reads /proc/cmdline (which contains the bootloader serial number).
[Unit]
ConditionKernelCommandLine=

[Service]
ExecStart=
ExecStart=/usr/bin/plymouthd --mode=boot --pid-file=/run/plymouth/pid --attach-to-session --kernel-command-line="quiet splash"
