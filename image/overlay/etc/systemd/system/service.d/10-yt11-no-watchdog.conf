# Lenovo YT-J706F: no service watchdogs. Suspend-to-idle does not freeze
# timekeeping on this SoC yet (no cpuidle state with s2idle support), so
# CLOCK_MONOTONIC runs on during suspend and, on resume, systemd finds every
# watchdog expired: after a suspend longer than 3 minutes it killed
# systemd-logind, which then never told NetworkManager to wake up (Wi-Fi
# stayed down). Remove once s2idle freezes timekeeping
# (docs/hardware/BOARD.md, Suspend).
[Service]
WatchdogSec=0
