# Fixed +15 dB on the built-in microphones: see
# /usr/share/wireplumber/scripts/yt11/mic-gain.lua.
wireplumber.components = [
  {
    name = yt11/mic-gain.lua, type = script/lua
    provides = custom.yt11-mic-gain
  }
]

wireplumber.profiles = {
  main = {
    custom.yt11-mic-gain = required
  }
}
