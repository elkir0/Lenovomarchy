# The MT7663 Wi-Fi (mt7663s) and Bluetooth (btmtksdio) functions download
# the same ROM patch. When Wi-Fi loads it first, Bluetooth setup then fails
# (WMT command 0xfc7a times out); when both race, Wi-Fi fails to get the
# patch semaphore. yt11-wifi-after-bt.service loads mt7663s once Bluetooth
# is set up.
blacklist mt7663s
