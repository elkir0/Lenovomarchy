# Minimal DHCP server on usb0 (USB CDC-ECM gadget link to host Mac).
# Gives the host 192.168.77.2/24 with no default route or DNS override so the
# host's internet connection is never hijacked.

interface=usb0
bind-interfaces
except-interface=lo
port=0
dhcp-range=192.168.77.2,192.168.77.2,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-authoritative
dhcp-leasefile=/run/usb-gadget-dnsmasq.leases
no-resolv
no-hosts
