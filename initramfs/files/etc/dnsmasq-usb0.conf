# DHCP-only dnsmasq for the Lenovomarchy USB gadget link.
# Alpine's busybox has no udhcpd applet, so dnsmasq fills in: exactly
# one lease (the Mac gets 192.168.77.2), no router, no DNS, lease
# file in /run.  DNS is fully disabled by port=0; this box only
# answers DHCP on usb0.
port=0
interface=usb0
bind-interfaces
user=root
dhcp-authoritative
dhcp-range=192.168.77.2,192.168.77.2,255.255.255.0,12h
dhcp-leasefile=/run/dnsmasq.leases
dhcp-option=3
dhcp-option=6
pid-file=/run/dnsmasq.pid
